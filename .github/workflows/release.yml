name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only one release at a time, and never cancel a run that may already be publishing.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # version commit, tags and GitHub releases
      pull-requests: write # the "version packages" PR
      id-token: write # npm provenance via OIDC
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

      # Written to the home directory so the version PR can never pick it up.
      # The token stays an env placeholder and is resolved by npm at publish time.
      - name: Configure npm authentication
        run: echo "//registry.npmjs.org/:_authToken=\${NPM_TOKEN}" > ~/.npmrc

      - uses: changesets/action@v1
        id: changesets
        with:
          version: pnpm changeset version
          publish: pnpm release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

      # The GitHub Action is used as Weber-Development/gradient@v0: move that tag to the release.
      - name: Move the action tag
        if: steps.changesets.outputs.published == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          git tag -f v0
          git push -f origin v0
