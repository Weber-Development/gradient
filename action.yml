name: Gradient color check
description: Checks that the color files generated by Gradient are up to date, and audits your stylesheets against the contrast promises. Comments the result on the pull request.
author: Weber Development
branding:
  icon: check-circle
  color: red

inputs:
  config:
    description: Path of gradient.config.json. The files in it are rebuilt and compared with the committed ones.
    default: gradient.config.json
  audit:
    description: Stylesheets to audit, separated by spaces or new lines. Optional.
    default: ""
  version:
    description: Version of @sweberdev/gradient to run.
    default: latest
  comment:
    description: Post the result as a comment on the pull request (needs pull-requests write permission).
    default: "true"

runs:
  using: composite
  steps:
    - shell: bash
      run: ${{ github.action_path }}/action/check.sh
      env:
        GRADIENT_CONFIG: ${{ inputs.config }}
        GRADIENT_AUDIT: ${{ inputs.audit }}
        GRADIENT_VERSION: ${{ inputs.version }}
        GRADIENT_COMMENT: ${{ inputs.comment }}
        GRADIENT_PR: ${{ github.event.pull_request.number }}
        GH_TOKEN: ${{ github.token }}
